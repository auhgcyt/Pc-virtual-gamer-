name: PC criado por @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Numero da instancia (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Repositorio de Checkout
        uses: actions/checkout@v4

      - name: Restaurar meus arquivos da ultima sessao
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
            C:\Users\runneradmin\Downloads
            C:\Users\runneradmin\Pictures
            C:\Users\runneradmin\Videos
            C:\Users\runneradmin\Music
          key: dados-inst${{ github.event.inputs.instance_number }}-${{ github.run_id }}
          restore-keys: |
            dados-inst${{ github.event.inputs.instance_number }}-

      - name: Informacoes do sistema
        run: |
          Write-Host "=== IMPLANTACAO ENIGMANO RDP ===" -ForegroundColor Green
          Write-Host "Numero da instancia: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Executor: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "Fluxo de trabalho: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "=== ESPECIFICACOES DO SISTEMA ===" -ForegroundColor Cyan
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Habilitar RDP
        run: |
          Write-Host "Habilitando a Area de Trabalho Remota..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Criar conta de usuario
        env:
          SENHA: ${{ secrets.SENHA_RDP }}
        run: |
          Write-Host "Configurando a conta de usuario..." -ForegroundColor Green
          if (-not $env:SENHA) { $env:SENHA = 'P@ssw0rd!' }
          $Password = ConvertTo-SecureString $env:SENHA -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
          Write-Host "Usuario: runneradmin" -ForegroundColor Yellow

      - name: Instalar Tailscale (Silencioso)
        run: |
          Write-Host "Baixando Tailscale..." -ForegroundColor Green
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Write-Host "Instalando o Tailscale silenciosamente..." -ForegroundColor Green
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale instalado com sucesso!" -ForegroundColor Green

      - name: Iniciar Tailscale
        env:
          TSKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "Iniciando o Tailscale..." -ForegroundColor Green
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TSKEY --hostname "enigmano-${{ github.event.inputs.instance_number }}"
          Start-Sleep -Seconds 15

      - name: Obter IP do Tailscale
        run: |
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Conecte pelo nome (MagicDNS): enigmano-${{ github.event.inputs.instance_number }}" -ForegroundColor Green
          Write-Host "Conecte pelo IP: $tsIP" -ForegroundColor Green
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Instalar o Google Chrome (Direto)
        run: |
          Write-Host "Baixando o Google Chrome..." -ForegroundColor Green
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
          Write-Host "Instalando o Google Chrome silenciosamente..." -ForegroundColor Green
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Google Chrome instalado!" -ForegroundColor Green

      - name: Instalar o 7-Zip (Direto)
        run: |
          Write-Host "Baixando 7-Zip..." -ForegroundColor Green
          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
          $installerPath = "$env:TEMP\7z-installer.exe"
          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
          Write-Host "Instalando o 7-Zip silenciosamente..." -ForegroundColor Green
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Remove-Item $installerPath -Force
          Write-Host "7-Zip instalado!" -ForegroundColor Green

      - name: Detalhes da conexao
        env:
          SENHA: ${{ secrets.SENHA_RDP }}
        run: |
          if (-not $env:SENHA) { $env:SENHA = 'P@ssw0rd!' }
          Write-Host ""
          Write-Host "=== DETALHES DA CONEXAO (TAILSCALE) ===" -ForegroundColor Green
          Write-Host "Host: $env:TAILSCALE_IP  (ou enigmano-${{ github.event.inputs.instance_number }})" -ForegroundColor White
          Write-Host "Usuario: runneradmin" -ForegroundColor White
          Write-Host "Senha: $env:SENHA" -ForegroundColor White
          Write-Host ""
          Write-Host "Instrucoes de conexao:" -ForegroundColor Yellow
          Write-Host "1. Instale o Tailscale no seu dispositivo (celular, tablet, Mac, Linux)" -ForegroundColor White
          Write-Host "2. Faca login com a mesma conta Tailscale" -ForegroundColor White
          Write-Host "3. Abra o app Area de Trabalho Remota e entre com o nome ou IP acima" -ForegroundColor White
          Write-Host "4. Use as credenciais fornecidas" -ForegroundColor White

      - name: Manter sessao viva (avisa na tela e nao te derruba no meio)
        env:
          TSKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "=== SESSAO ATIVA ===" -ForegroundColor Green
          Write-Host "A instancia RDP do EnigMano esta em execucao!" -ForegroundColor Cyan
          Write-Host "Troca automatica a cada ~6h (limite gratis do GitHub), salvando tudo antes." -ForegroundColor Yellow
          $limite = [TimeSpan]::FromMinutes(345)
          $inicio = Get-Date
          $heartbeat = 0
          while ($true) {
            Start-Sleep -Seconds 30
            $decorrido = (Get-Date) - $inicio
            $heartbeat++
            $remoto = Get-CimInstance Win32_LogonSession -Filter "LogonType=10" -ErrorAction SilentlyContinue
            $temGente = ($null -ne $remoto)
            if ($heartbeat % 4 -eq 0) {
              $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status
              if ($tsStatus -match "active") {
                Write-Host "Status do Tailscale: ATIVO" -ForegroundColor Green
              } else {
                Write-Host "Status do Tailscale: ERRO - Reiniciando..." -ForegroundColor Red
                & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TSKEY --hostname "enigmano-${{ github.event.inputs.instance_number }}"
              }
            }
            if ($decorrido -ge $limite) {
              if ($temGente) {
                Write-Host "Voce esta dentro! Avisando na tela..." -ForegroundColor Yellow
                msg * "TROCA AUTOMATICA EM ~5 MIN (limite gratis do GitHub). Salvando seus arquivos agora. Quando cair, reconecte que esta tudo la." 2>$null
                Start-Sleep -Seconds 60
              } else {
                Write-Host "Ninguem usando, rotacionando em silencio..." -ForegroundColor Green
              }
              break
            }
            Write-Host "Sessao ativa - Pulsacao #$heartbeat | falta: $([TimeSpan]::FromMinutes(345) - $decorrido)" -ForegroundColor Green
          }

      - name: Salvar meus arquivos antes de trocar
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
            C:\Users\runneradmin\Downloads
            C:\Users\runneradmin\Pictures
            C:\Users\runneradmin\Videos
            C:\Users\runneradmin\Music
          key: dados-inst${{ github.event.inputs.instance_number }}-${{ github.run_id }}

      - name: Chamar a proxima execucao sozinho
        if: always()
        continue-on-error: true
        env:
          PAT: ${{ secrets.PAT_REINICIO }}
          REF: ${{ github.ref_name }}
          INST: ${{ github.event.inputs.instance_number }}
        run: |
          $inst = if ($env:INST) { $env:INST } else { "1" }
          $body = @{ ref = $env:REF; inputs = @{ instance_number = $inst } } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/blank.yml/dispatches" -Headers @{ Authorization = "Bearer $env:PAT"; Accept = "application/vnd.github+json" } -Body $body -ContentType "application/json"
          Write-Host "Proxima execucao chamada! Reconecte em ~2 minutos." -ForegroundColor Green
          
